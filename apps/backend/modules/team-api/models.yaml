models:
  TeamApi:
    fields:
      id:
        type: String
        attributes:
          - '@id'
          - '@default(cuid())'
      name:
        type: String
        isRequired: false
      createdAt:
        type: DateTime
        attributes:
          - '@default(now())'
      updatedAt:
        type: DateTime
        attributes:
          - '@updatedAt'
